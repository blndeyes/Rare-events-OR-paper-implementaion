# Reproducible official upstream snapshots selected before the target paper release.
ltx_video_inference:
  repository: https://github.com/Lightricks/ltx-video
  commit: 20799e51cd739986d98d9b1aab55cc2067c1eabb
  reason: last audited legacy snapshot retaining the official 0.9.7-dev configuration
  checkpoint: ltxv-13b-0.9.7-dev.safetensors
  spatial_upscaler: ltxv-spatial-upscaler-0.9.7.safetensors

ltx_video_trainer:
  repository: https://github.com/Lightricks/LTX-Video-Trainer
  commit: e055182fa36dba6f48eb0919aef09d277da30fbd
  config: configs/ltxv_13b_ic_lora.yaml
  checkpoint: LTXV_13B_097_DEV
  selection_basis: last official legacy-trainer commit before the target paper release

video_depth_anything:
  repository: https://github.com/DepthAnything/Video-Depth-Anything
  commit: 4f5ae23172ba60fd7bc11ef671cca678842c7072
  mode: relative
  encoder: vitl
  selection_basis: official relative-depth inference default; paper does not name model size

sam2:
  repository: https://github.com/facebookresearch/sam2
  commit: 2b90b9f5ceec907a1c18123530e92e794ad901a4
  checkpoint: sam2.1_hiera_large.pt
  config: configs/sam2.1/sam2.1_hiera_l.yaml
  selection_basis: official video-predictor example; paper does not name model size

# Evaluation backends are reproduction hypotheses because the target paper names
# metrics but does not identify implementation snapshots or preprocessing.
google_research_fvd:
  repository: https://github.com/google-research/google-research
  commit: 08a8d6736475776f42ffac23b2c13111a28e5795
  module: frechet_video_distance/frechet_video_distance.py
  embedding: deepmind_i3d_kinetics_400
  selection_basis: official implementation snapshot audited for this reproduction

dover:
  repository: https://github.com/VQAssessment/DOVER
  commit: f1ddc96215bc7fbcf8f315c65d47905f339c3419
  entrypoint: evaluate_one_video.py
  output: normalized_fused_overall_score
  selection_basis: official implementation snapshot audited for this reproduction

lpips:
  repository: https://github.com/richzhang/PerceptualSimilarity
  commit: 082bb24f84c091ea94de2867d34c4544f68e0963
  pypi_package: lpips==0.1.4
  network: alex
  calibration_version: "0.1"
  selection_basis: official released package and source snapshot
