schema_version: 1

# Memory-safe reproduction hypothesis for a 24 GiB RTX 4090. The paper names
# PatchGAN and cites pix2pix but does not disclose its discriminator domain or
# architecture. This deliberately operates on LTX latents, samples latent
# frames, and never performs a differentiable 1024x768x97 VAE decode.
patchgan:
  enabled: true
  architecture: latent_patchgan_16x16_2d
  sample_channels: 128
  condition_channels: 128
  base_channels: 64
  layers: 1
  max_channels: 128
  normalization: instance
  input_normalization: identity
  objective: bce
  adversarial_weight: 0.1
  start_step: 0
  frame_stride: 4
  frame_batch_size: 1
  gradient_checkpointing: false
  learning_rate: 0.0002
  beta1: 0.5
  beta2: 0.999
  discriminator_updates: 1
  domain: latent
