# Frozen conventions for the fine-grained OR video evaluation.
# Paths are CLI arguments; this file must not contain machine-specific data.
schema_version: 1
video_contract:
  width: 1024
  height: 768
  frames: 97
  fps: 24.0
  pixel_format: rgb24
frame_sampling:
  policy: uniform_inclusive_endpoints
  sample_count: 16
  include_frame_zero: true
  include_last_frame: true
  seed: 42
kernels:
  clip_mmd:
    type: unbiased_rbf
    sigma: 10
    scale: 1000
    model: openai/clip-vit-large-patch14-336
    preprocess: bicubic_resize_336_no_crop_clip_mean_std
    feature: get_image_features
  kid:
    type: polynomial
    degree: 3
    formula: "(x^T y / d + 1)^3"
    subsets: 100
    subset_size: n_over_2
    n_definition: embeddings_per_set_equal_real_and_generated
    seed: 42
dinov2:
  model: facebook/dinov2-large
  resize: 256
  crop: 224
  feature: cls_token
  nearest_k: 5
dinov3:
  model: facebook/dinov3-vitl16-pretrain-lvd1689m
  pooling: avg3x3_stride1_pad1
  coreset:
    algorithm: greedy_farthest_first_kcenter
    size: 2048
    distance: euclidean
    seed: 42
  no_silent_fallback: dinov2
aggregation:
  point_estimates: pooled_selected_embeddings
  uncertainty: video_level_bootstrap
  bootstrap_samples: 200
  seed: 42
  six_video_warning: true
  wan_is_diagnostic: true
  do_not_merge_mmor_and_4dor: true
hands:
  detector: mediapipe.tasks.vision.HandLandmarker
  model_asset: hand_landmarker.task
  no_silent_fallback: mediapipe.solutions.hands
  confidence: 0.5
  crop_margin: 0.2
  embedding: clip_vit_l14_336
  no_detection_score: unavailable
anatomy:
  vbench2_dimension: Human_Anatomy
  vbench2_evaluator: evaluate.py
  vbench2_mode: custom_input
  person_detector: facebook/detr-resnet-50
  mpjpe_if_unmatched: unavailable
control_fidelity:
  independent_depth: depth-anything/Depth-Anything-V2-Large-hf
  forbid_psnr_ssim_against_ellipse_rgb: true
motion:
  primary: fvmd
  fvmd_python: required
  fvmd_invocation: "python -m fvmd --log_dir GEN GT"
  ranking_only: jedi
  jedi_python: optional_external
  jedi_checkpoints:
    encoder: vith16.pth.tar
    probe: ssv2-probe.pth.tar
    config: vith16_ssv2_16x2x3.yaml
