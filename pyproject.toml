[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "or-video-reproduction"
version = "0.1.0"
description = "Reproduction of geometry-conditioned OR video synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
or-dataset-inventory = "or_video_reproduction.data.inventory:main"
or-mmor-semantics = "or_video_reproduction.data.semantics:main"
or-geometry-preview = "or_video_reproduction.geometry.preview:main"
or-geometry-sequence-preview = "or_video_reproduction.geometry.sequence_preview:main"
or-build-mmor-clip = "or_video_reproduction.data.clips:main"
or-plan-ltx-interpolation = "or_video_reproduction.preprocessing.ltx_interpolation:main"
or-propagate-sam2 = "or_video_reproduction.preprocessing.sam2_propagation:main"
or-render-geometry-sequence = "or_video_reproduction.geometry.render_sequence:main"
or-run-ltx-batch = "or_video_reproduction.preprocessing.ltx_batch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
